# Gitleaks configuration for rootcoz
# https://github.com/gitleaks/gitleaks#configuration

[extend]
# Use the default gitleaks config as a base
useDefault = true

[allowlist]
# Allowlist test files that contain fake/mock credentials for unit tests
paths = [
    # Auto-generated docs contain placeholder API keys that trigger false positives
    '''docs/.*''',
    # storage.py migration_key variables trigger generic-api-key false positives
    '''src/rootcoz/storage\.py''',
    '''\.secrets\.baseline''',
    '''tests/test_config\.py''',
    '''tests/test_main\.py''',
    '''tests/conftest\.py''',
    '''tests/test_cli_main\.py''',
    '''tests/test_cli_client\.py''',
    '''tests/test_auth\.py''',
    '''tests/test_debug_request_logging\.py''',
    '''tests/test_feedback\.py''',
]
