# Gitleaks configuration for rootcoz
# https://github.com/gitleaks/gitleaks#configuration

[extend]
# Use the default gitleaks config as a base
useDefault = true

[[allowlists]]
# Allowlist test files that contain fake/mock credentials for unit tests
paths = [
    # Auto-generated docs contain placeholder API keys that trigger false positives
    '''docs/.*''',
    '''\.secrets\.baseline''',
    '''tests/test_config\.py''',
    '''tests/test_main\.py''',
    '''tests/conftest\.py''',
    '''tests/test_cli_main\.py''',
    '''tests/test_cli_client\.py''',
    '''tests/test_auth\.py''',
    '''tests/test_debug_request_logging\.py''',
    '''tests/test_feedback\.py''',
    '''tests/test_jira\.py''',
]
# Migration idempotency keys are not secrets
regexTarget = "line"
regexes = [
    '''migration_key\s*=\s*"[^"]+"''',
]

[[allowlists]]
# The fixture Atlassian cloud-ID placeholder (UUID) is not a secret. Matched
# against the finding itself, never the line, so a real credential sharing the
# line is still reported.
regexTarget = "match"
regexes = [
    '''(?i)atlassian_oauth_cloud_id"?\s*[:=]\s*"?2b9e35e3-6bd3-4cec-b838-f4249ee02432"?''',
]
