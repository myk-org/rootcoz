# Gitleaks configuration for rootcoz
# https://github.com/gitleaks/gitleaks#configuration

[extend]
# Use the default gitleaks config as a base
useDefault = true

[allowlist]
# Allowlist test files that contain fake/mock credentials for unit tests
paths = [
    # Auto-generated docs contain placeholder API keys that trigger false positives
    '''docs/.*''',
    '''\.secrets\.baseline''',
    '''tests/test_config\.py''',
    '''tests/test_main\.py''',
    '''tests/conftest\.py''',
    '''tests/test_cli_main\.py''',
    '''tests/test_cli_client\.py''',
    '''tests/test_auth\.py''',
    '''tests/test_debug_request_logging\.py''',
    '''tests/test_feedback\.py''',
    '''tests/test_jira\.py''',
]
# Migration idempotency keys are not secrets
regexTarget = "line"
regexes = [
    '''migration_key\s*=\s*"[^"]+"''',
    # Example Atlassian cloud-ID placeholders (UUIDs), not secrets
    '''ATLASSIAN_OAUTH_CLOUD_ID\s*=\s*"?[0-9a-f-]{36}"?''',
    # lowercase settings attribute variant used in unit tests
    '''atlassian_oauth_cloud_id\s*=\s*"[0-9a-f-]{36}"''',
]
