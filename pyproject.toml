[project]
name = "rootcoz"
version = "4.1.0"
description = "AI-powered root cause analysis for CI/CD test failures"
requires-python = ">=3.12"
dependencies = [
  "ai-cli-runner>=0.4.0",
  "aiosqlite",
  "cryptography>=46.0.5",
  "defusedxml>=0.7.1",
  "fastapi",
  "gitpython",
  "httpx",
  "pydantic-settings",
  "python-jenkins",
  "python-multipart",
  "pyyaml",
  "pywebpush",
  "python-simple-logger",
  "reportportal-client>=5.7.4",
  "typer>=0.9.0",
  "uvicorn",
  "pyyaml>=6.0.3",
]

[project.scripts]
rootcoz-server = "rootcoz.main:run"
rootcoz = "rootcoz.cli.main:app"

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # aiosqlite worker threads race with event loop teardown — not fixable in user code
    "ignore:Exception in thread.*_connection_worker_thread:pytest.PytestUnhandledThreadExceptionWarning",
    # AsyncMock coroutines collected by GC during teardown — pytest-asyncio/unittest.mock interaction
    "ignore:coroutine.*AsyncMockMixin.*was never awaited:RuntimeWarning",
    # Starlette per-request cookies= deprecation — API still works, migrate when removed
    "ignore:Setting per-request cookies=:DeprecationWarning",
    # PytestCollectionWarning suppressed by renaming TestFailure → FailedTest; keep filter
    # in case other Pydantic models accidentally use Test* prefix in the future
    "ignore::pytest.PytestCollectionWarning",
    # Async transport cleanup during parallel test teardown
    "ignore:unclosed transport:ResourceWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rootcoz"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
