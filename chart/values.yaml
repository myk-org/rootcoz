# Bootstrap-only Helm values for rootcoz.
# Integrations (Jenkins, Jira, GitHub, Report Portal, feature toggles) are configured
# via Server Settings in the UI after first login.

nameOverride: ""
fullnameOverride: ""

image:
  # Container image repository
  repository: ghcr.io/myk-org/rootcoz
  # Image tag (defaults to latest when empty)
  tag: ""
  pullPolicy: Always

# Pull secrets for private registries (create manually; see chart/README.md)
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# OpenShift Route (default on). Disable when using Ingress or ClusterIP-only access.
route:
  enabled: true
  # Optional: set a custom hostname. If empty, OpenShift auto-generates one.
  host: ""
  # Long timeout for AI analysis and SSE streams
  timeout: 300s
  annotations: {}

# Kubernetes Ingress (vanilla K8s). Mutually exclusive with route.enabled.
ingress:
  enabled: false
  host: ""
  className: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

ai:
  # Required: Pi-sidecar-discovered provider ID → AI_PROVIDER
  provider: ""
  # Required → AI_MODEL
  model: ""
  # When provider=gemini → GEMINI_API_KEY (secret)
  geminiApiKey: ""
  # When provider=claude (Anthropic API) → ANTHROPIC_API_KEY (secret)
  anthropicApiKey: ""
  vertex:
    # When provider=claude via Google Vertex AI
    enabled: false
    # → ANTHROPIC_VERTEX_PROJECT_ID (configmap)
    projectId: ""
    # → CLOUD_ML_REGION (configmap)
    region: us-east5
    # GCP service account JSON key (secret, mounted at /gcloud-credentials)
    serviceAccountKey: ""
  cursor:
    # When provider=cursor → CURSOR_API_KEY (secret)
    apiKey: ""
    # Cursor auth.json content (secret, mounted at /home/appuser/.cursor-auth/auth.json)
    authJson: ""

# Datadog event exporter (optional) → DATADOG_API_KEY and DATADOG_APP_KEY,
# both stored in the credentials Secret. The v2 event intake requires the
# pair: the API key identifies the organization, the application key
# authorizes the request. Site, service, env, and the enable toggle are
# DB-configurable Server Settings — no chart wiring needed for them.
datadog:
  apiKey: ""
  appKey: ""

# Pi SDK sidecar custom providers/settings (pi-sidecar >=4.9.0) via a persistent
# agent dir. Files are read once at sidecar start; changing them rolls the
# Deployment (checksum-tracked) so the sidecar restarts with the new content.
sidecar:
  agentDir:
    # models.json content — custom pi providers (string or YAML object),
    # mounted at /etc/pi-sidecar-agent/models.json
    modelsJson: ""
    # auth.json content — provider credentials (string or YAML object),
    # mounted at /etc/pi-sidecar-agent/auth.json
    authJson: ""
    # settings.json content — seeded into the sidecar's in-memory settings
    # store (string or YAML object), mounted at /etc/pi-sidecar-agent/settings.json
    settingsJson: ""
    # Secret env vars for API keys referenced as "$VAR" in models.json,
    # e.g. env: { MYGATEWAY_API_KEY: "..." } → container env var MYGATEWAY_API_KEY.
    # A key set to "" removes it (tombstone); omitting the key preserves the
    # existing Secret value on upgrade. Chart-managed variable names are rejected.
    env: {}

# Bootstrap admin API key → ADMIN_KEY (secret). Required by scripts/helm-setup.py;
# auto-generated on first install if empty (manual helm installs only).
admin:
  key: ""

# → ROOTCOZ_ENCRYPTION_KEY (separate secret). Auto-generated on first install if empty.
encryptionKey: ""

persistence:
  enabled: true
  # PVC size for SQLite database and app data
  size: 5Gi
  storageClass: ""
  annotations:
    helm.sh/resource-policy: keep

resources:
  # Modest defaults for dev/evaluation clusters. For production AI workloads apply
  # chart/examples/values-production.yaml (4 CPU / 32Gi / 16Gi ephemeral-storage);
  # sizing basis in chart/README.md. ephemeral-storage defaults to 12Gi here and
  # goes on both requests and limits — the limit is what caps /tmp: it becomes the
  # /tmp emptyDir sizeLimit and adds TMPDIR=/tmp (so it mounts /tmp and rolls the
  # pod once). 12Gi is a judgement from the configured ceilings (~3 GiB graph
  # indexes + ~5.5 GiB concurrent clones + ~0.6 GiB artifacts + ~1 GiB writable
  # layer ≈ 10 GiB, rounded up), not a measurement — the arithmetic is in
  # chart/README.md. It is deliberately below the production profile's 16Gi so the
  # overlay still means something and a default pod still schedules on a
  # CRC-sized node. #402 C1 requires this cap by default.
  # "" drops a key, but a cleared request is not "no floor": Kubernetes copies the
  # limit into the request, so requests.memory: "" still schedules for
  # limits.memory. Clear both for a real no-floor pod (a LimitRange default also
  # supplies the request) — and clear both ephemeral-storage keys to drop the /tmp
  # cap, since the limit alone mounts the volume.
  # Ownership: this chart owns the /tmp sizeLimit and derives it from
  # limits.ephemeral-storage — there is no separate workspace.sizeLimit key. #402 C1
  # puts the same emptyDir cap on the live deployment, so both must carry the same
  # number (the production example uses 16Gi).
  requests:
    cpu: "1"
    memory: 4Gi
    ephemeral-storage: 12Gi
  limits:
    cpu: "2"
    memory: 8Gi
    ephemeral-storage: 12Gi

probes:
  # The probe timing fields the template renders come from here; the probe
  # targets do not (see the comment above readinessProbe in deployment.yaml).
  startup:
    # exec curl /api/health — waits for the backend *and* the sidecar, so the
    # thresholds are generous: 2 s × 30, plus up to 10 s inside one attempt.
    # No initialDelaySeconds: absent renders nothing, the API defaults it to 0
    # and the exec already waits, so a key here would have exactly one value.
    periodSeconds: 2
    timeoutSeconds: 10
    failureThreshold: 30
    # shortcut: one legal value — Kubernetes requires 1 for startup and
    # liveness, the schema pins enum [1], and a literal `1` in the template
    # renders identically. Kept on both probes only because the issue asks for
    # every field; delete key, reference and schema entry together when nobody
    # cares. Readiness is the odd one out: it may be > 1.
    successThreshold: 1
  readiness:
    # /health answers in ~1 ms (main.py:14448-14451). This timeout absorbs a
    # stalled event loop, not a slow response: one analysis costs ~2-3 s of loop
    # time, and at 1 s three of those in a row pulled the pod from the Service
    # and tore down every SSE stream (#402 B1 → 5).
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    # Consecutive successes required before an unready pod gets traffic again.
    # 1 matches the old literal; raise it to 2+ to stop a pod flapping on a
    # half-recovered backend. Kubernetes allows any value >= 1 here.
    successThreshold: 1
  liveness:
    # Budget: 30 s × 5 ≈ 2.5 min of unresponsiveness before SIGTERM, up to ~5 min
    # when every attempt burns its 30 s timeout. It fired correctly on 2026-11-04;
    # deliberately NOT widened to hide a real stall (#402 B3).
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 5
    successThreshold: 1  # shortcut: constant (Kubernetes requires 1), see startup

env:
  # OpenShift arbitrary-UID compatibility → XDG_DATA_HOME
  xdgDataHome: /data
  # Writable config dir → XDG_CONFIG_HOME
  xdgConfigHome: /tmp/config
  # Override auto-derived SECURE_COOKIES (true when Route or TLS Ingress, else false)
  secureCookies: ""
  # Override auto-derived PUBLIC_BASE_URL (https://route.host or ingress host)
  publicBaseUrl: ""
  metadataRulesFile: ""
  # pi-sidecar session transcript recording (>= 4.12.0). Toggling it in
  # Server Settings applies immediately via the sidecar runtime toggle
  # (pi-sidecar >= 4.14.0) — no restart needed. Files land under the data
  # volume (xdgDataHome) and survive pod replacement. Admin-only retrieval
  # via GET /api/admin/transcripts.
  recordTranscripts: false
  # Override the transcripts directory (default: <xdgDataHome>/pi-sidecar/transcripts)
  sidecarTranscriptsDir: ""

tuning:
  # → LOG_LEVEL (omit for app default INFO)
  logLevel: ""

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# OpenShift ImageStream for auto-import from GHCR (optional)
imageStream:
  enabled: false
  name: rootcoz
  namespace: ""

# Helm test pod image (must include curl)
tests:
  image: curlimages/curl:8.12.1

# Health alert CronJob (optional): scrapes /metrics every `schedule` and posts
# one Slack message combining every failing check. The script lives in
# chart/files/health-alert.sh and is tested by tests/test_health_alert_script.py.
alerts:
  # Opt-in: enabling it creates the CronJob and its script ConfigMap.
  enabled: false
  # CronJob name override, truncated to 52 chars (the Job controller appends 11).
  # Empty means <fullname-trunc29>-<hash8>-health-alerts. Overriding the name does
  # NOT adopt an existing cluster-only CronJob: adoption is Helm ownership metadata,
  # and a name alone leaves the helm upgrade failing with `invalid ownership metadata`.
  # Adopt one by adding that metadata to it first (or just delete it), e.g.
  #   kubectl -n rootcoz label cronjob rootcoz-prod-health-alerts app.kubernetes.io/managed-by=Helm
  #   kubectl -n rootcoz annotate cronjob rootcoz-prod-health-alerts \
  #     meta.helm.sh/release-name=rootcoz meta.helm.sh/release-namespace=rootcoz
  name: ""
  # Cron expression for the scrape
  schedule: "*/5 * * * *"
  # Label prefixed to every message; empty means <fullname>
  envLabel: ""
  # Metrics endpoint; empty means http://<fullname>:8000/metrics
  metricsUrl: ""
  # Must provide sh, awk and curl. Pin by digest for production deployments.
  image: curlimages/curl:8.12.1
  # Secret holding the Slack webhook; empty means the release credentials Secret
  slackSecretName: ""
  slackSecretKey: SLACK_WEBHOOK_URL  # pragma: allowlist secret
  # Alert when the rolling-window error rate exceeds this percentage
  errorRatePercent: 5
  # /data volume usage warning threshold, in percent
  diskWarnPercent: 75
  # /data volume usage critical threshold, in percent
  diskCritPercent: 90
