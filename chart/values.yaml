# Bootstrap-only Helm values for rootcoz.
# Integrations (Jenkins, Jira, GitHub, Report Portal, feature toggles) are configured
# via Server Settings in the UI after first login.

nameOverride: ""
fullnameOverride: ""

image:
  # Container image repository
  repository: ghcr.io/myk-org/rootcoz
  # Image tag (defaults to latest when empty)
  tag: ""
  pullPolicy: Always

# Pull secrets for private registries (create manually; see chart/README.md)
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# OpenShift Route (default on). Disable when using Ingress or ClusterIP-only access.
route:
  enabled: true
  # Optional: set a custom hostname. If empty, OpenShift auto-generates one.
  host: ""
  # Long timeout for AI analysis and SSE streams
  timeout: 300s
  annotations: {}

# Kubernetes Ingress (vanilla K8s). Mutually exclusive with route.enabled.
ingress:
  enabled: false
  host: ""
  className: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

ai:
  # Required: gemini | claude | cursor → AI_PROVIDER
  provider: ""
  # Required → AI_MODEL
  model: ""
  # When provider=gemini → GEMINI_API_KEY (secret)
  geminiApiKey: ""
  # When provider=claude (Anthropic API) → ANTHROPIC_API_KEY (secret)
  anthropicApiKey: ""
  vertex:
    # When provider=claude via Google Vertex AI
    enabled: false
    # → ANTHROPIC_VERTEX_PROJECT_ID (configmap)
    projectId: ""
    # → CLOUD_ML_REGION (configmap)
    region: us-east5
    # GCP service account JSON key (secret, mounted at /gcloud-credentials)
    serviceAccountKey: ""
  cursor:
    # When provider=cursor → CURSOR_API_KEY (secret)
    apiKey: ""
    # Cursor auth.json content (secret, mounted at /home/appuser/.cursor-auth/auth.json)
    authJson: ""

# Bootstrap admin API key → ADMIN_KEY (secret). Required by scripts/helm-setup.py;
# auto-generated on first install if empty (manual helm installs only).
admin:
  key: ""

# → ROOTCOZ_ENCRYPTION_KEY (separate secret). Auto-generated on first install if empty.
encryptionKey: ""

# Greenwave / ResultsDB / WaiverDB exporter (optional).
# The URL/tokens/mapping/template/auth/etc. are admin-editable in Server Settings
# (values here provide bootstrap/defaults). Only gating-safety toggles
# (enable/pushWaivers/allowAiWaivers) are strictly env-only. Leave enabled=false to disable.
greenwave:
  # → ENABLE_GREENWAVE (configmap). Set true to enable the exporter.
  enabled: false
  # → GREENWAVE_URL (configmap). ResultsDB API base URL.
  url: ""
  # → GREENWAVE_API_TOKEN (secret). ResultsDB API token.
  apiToken: ""
  # → GREENWAVE_WAIVER_URL (configmap). Required when pushWaivers=true.
  waiverUrl: ""
  # → GREENWAVE_WAIVER_TOKEN (secret). Required when pushWaivers=true and waiverAuthMethod=oidc.
  waiverToken: ""
  # → GREENWAVE_PUSH_WAIVERS (configmap). Enable waiver submission to WaiverDB.
  pushWaivers: false
  # → GREENWAVE_ALLOW_AI_WAIVERS (configmap). Allow rootcoz-ai reviews to waive.
  allowAiWaivers: false
  # → GREENWAVE_WAIVABLE_CLASSIFICATIONS (configmap). Comma-separated list.
  waivableClassifications: "INFRASTRUCTURE"
  # → GREENWAVE_OUTCOME_MAP (configmap). CLASS:OUTCOME,... mapping.
  outcomeMap: "PRODUCT BUG:FAILED,CODE ISSUE:FAILED,INFRASTRUCTURE:INFO"
  # → GREENWAVE_SUBJECT_TYPE (configmap). ResultsDB subject type.
  subjectType: "koji_build"
  # → GREENWAVE_PRODUCT_VERSION (configmap). Required when pushWaivers=true.
  productVersion: ""
  # → GREENWAVE_VERIFY_SSL (configmap). False permits isolated-dev HTTP only for unauthenticated (none) auth when caBundle is empty; all authenticated methods (token, oidc, kerberos, ssl) always require HTTPS.
  verifySsl: true
  # → GREENWAVE_RESULTSDB_AUTH_METHOD (configmap): none|token|kerberos|ssl
  resultsdbAuthMethod: "token"
  # → GREENWAVE_WAIVER_AUTH_METHOD (configmap): oidc|kerberos|ssl
  waiverAuthMethod: "oidc"
  # → GREENWAVE_TESTCASE_TEMPLATE (configmap). Example: myproduct.product-build.{tier}.{test_name}
  testcaseTemplate: "rootcoz.{job_name}.{test_name}"
  # → GREENWAVE_SUBJECT_TEMPLATE (configmap). Template for constructing the subject
  # identifier when no explicit subject is provided. Required for AUTO_PUSH_EXPORTERS=greenwave.
  # Placeholders: {job_name},{build_number},{tier},{product_version}.
  # Example: hco-bundle-registry-container-{product_version}.rhel9-{build_number}
  subjectTemplate: ""
  # → GREENWAVE_TIER (configmap). Value for {tier} placeholder (e.g. tier-1).
  tier: ""
  # → GREENWAVE_KERBEROS_PRINCIPAL (configmap). e.g. svc-rootcoz@EXAMPLE.COM
  kerberosPrincipal: ""
  # Base64-encoded keytab file content (run: base64 -w0 krb5.keytab). Stored as-is in a Secret and mounted read-only at kerberosKeytabPath.
  kerberosKeytab: ""
  # → GREENWAVE_KERBEROS_KEYTAB (configmap): in-pod mount path of the keytab file.
  kerberosKeytabPath: "/etc/rootcoz/greenwave/krb5.keytab"
  # → GREENWAVE_SSL_CERT / GREENWAVE_SSL_KEY (configmap): in-pod paths (mount separately if used)
  sslCert: ""
  sslKey: ""
  # → GREENWAVE_CA_BUNDLE (configmap). Path to CA PEM for TLS verification.
  caBundle: ""

persistence:
  enabled: true
  # PVC size for SQLite database and app data
  size: 5Gi
  storageClass: ""
  annotations:
    helm.sh/resource-policy: keep

resources:
  # Modest defaults for dev/evaluation clusters. For production AI workloads use
  # requests/limits of 4 CPU and 32Gi memory (see chart/README.md).
  requests:
    cpu: "1"
    memory: 4Gi
  limits:
    cpu: "2"
    memory: 8Gi

env:
  # OpenShift arbitrary-UID compatibility → XDG_DATA_HOME
  xdgDataHome: /data
  # Writable config dir → XDG_CONFIG_HOME
  xdgConfigHome: /tmp/config
  # Override auto-derived SECURE_COOKIES (true when Route or TLS Ingress, else false)
  secureCookies: ""
  # Override auto-derived PUBLIC_BASE_URL (https://route.host or ingress host)
  publicBaseUrl: ""
  metadataRulesFile: ""

tuning:
  # → LOG_LEVEL (omit for app default INFO)
  logLevel: ""

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# OpenShift ImageStream for auto-import from GHCR (optional)
imageStream:
  enabled: false
  name: rootcoz
  namespace: ""

# Helm test pod image (must include curl)
tests:
  image: curlimages/curl:8.12.1
