{{- include "rootcoz.validate" . -}}
{{- if .Values.ai.cursor.authJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rootcoz.cursorAuthSecretName" . }}
  labels:
    {{- include "rootcoz.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth.json: |
    {{- if kindIs "string" .Values.ai.cursor.authJson }}
    {{- .Values.ai.cursor.authJson | nindent 4 }}
    {{- else }}
    {{- .Values.ai.cursor.authJson | toJson | nindent 4 }}
    {{- end }}
{{- end }}
