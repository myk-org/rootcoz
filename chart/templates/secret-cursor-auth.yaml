{{- include "rootcoz.validate" . -}}
{{- $auth := include "rootcoz.cursorAuthJson" . -}}
{{- if $auth }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rootcoz.cursorAuthSecretName" . }}
  labels:
    {{- include "rootcoz.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth.json: |
    {{- $auth | nindent 4 }}
{{- end }}
