{{- include "rootcoz.validate" . -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rootcoz.fullname" . }}
  labels:
    {{- include "rootcoz.labels" . | nindent 4 }}
  annotations:
    {{- /* nginx-specific timeout for long AI / SSE requests; skip for other classes */}}
    {{- if or (eq .Values.ingress.className "") (contains "nginx" .Values.ingress.className) }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rootcoz.fullname" . }}
                port:
                  name: http
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ default (printf "%s-tls" (include "rootcoz.fullname" .)) .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
