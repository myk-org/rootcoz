{{- include "rootcoz.validate" . -}}
{{- if .Values.snapshots.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rootcoz.fullname" . }}-snapshot-manager
  labels:
    {{- include "rootcoz.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rootcoz.fullname" . }}-snapshot-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "rootcoz.fullname" . }}-snapshot
    namespace: {{ .Release.Namespace }}
{{- end }}
