{{- include "rootcoz.validate" . -}}
{{- if .Values.alerts.enabled -}}
{{- $alerts := .Values.alerts -}}
{{- /* Null tests, not `default`: a legacy errorRatePercent: 0 means "page on any
       server error" and `default` would silently widen it to 5. */ -}}
{{- $serverPercent := 5 -}}
{{- if not (kindIs "invalid" $alerts.serverErrorPercent) -}}
{{- $serverPercent = $alerts.serverErrorPercent -}}
{{- else if not (kindIs "invalid" $alerts.errorRatePercent) -}}
{{- $serverPercent = $alerts.errorRatePercent -}}
{{- end -}}
{{- /* `default` is safe on these two: the schema enforces minimum 1, so 0 cannot
       arrive here and be widened. */ -}}
{{- $clientPercent := $alerts.clientErrorPercent | default 25 -}}
{{- $clientMinRequests := $alerts.clientErrorMinRequests | default 10 -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rootcoz.healthAlertsConfigMapName" . }}
  labels:
    {{- include "rootcoz.labels" . | nindent 4 }}
data:
  health-alert.sh: |
{{ .Files.Get "files/health-alert.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rootcoz.healthAlertsCronJobName" . }}
  labels:
    {{- include "rootcoz.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.alerts.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            {{- include "rootcoz.labels" . | nindent 12 }}
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: Never
          serviceAccountName: {{ include "rootcoz.serviceAccountName" . }}
          # The job only curls the application Service; it never calls the API
          # server, so it is handed no cluster identity.
          automountServiceAccountToken: false
          securityContext:
            {{- include "rootcoz.podSecurityContext" . | nindent 12 }}
          containers:
            - name: health-alert
              image: {{ .Values.alerts.image | quote }}
              securityContext:
                {{- include "rootcoz.containerSecurityContext" . | nindent 16 }}
              resources:
                # Small and equal on both sides: sh + curl need no burst room, and
                # quota-enforced namespaces (LimitRange / ResourceQuota without
                # defaults) reject containers without requests.
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 10m
                  memory: 16Mi
              command: ["/bin/sh", "/scripts/health-alert.sh"]
              env:
                - name: METRICS_URL
                  value: {{ .Values.alerts.metricsUrl | default (printf "http://%s:8000/metrics" (include "rootcoz.fullname" .)) | quote }}
                - name: ENV_LABEL
                  value: {{ .Values.alerts.envLabel | default (include "rootcoz.fullname" .) | quote }}
                - name: SERVER_ERROR_PERCENT
                  value: {{ $serverPercent | quote }}
                - name: CLIENT_ERROR_PERCENT
                  value: {{ $clientPercent | quote }}
                - name: CLIENT_ERROR_MIN_REQUESTS
                  value: {{ $clientMinRequests | quote }}
                - name: DISK_WARN_PERCENT
                  value: {{ .Values.alerts.diskWarnPercent | quote }}
                - name: DISK_CRIT_PERCENT
                  value: {{ .Values.alerts.diskCritPercent | quote }}
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.alerts.slackSecretName | default (include "rootcoz.credentialsSecretName" .) }}
                      key: {{ .Values.alerts.slackSecretKey }}
                      # Optional so the job still schedules (and logs) on a
                      # deployment that never configured a webhook.
                      optional: true
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: {{ include "rootcoz.healthAlertsConfigMapName" . }}
{{- end }}
