{{- include "rootcoz.validate" . -}}
{{- $data := include "rootcoz.sidecarAgentSecretData" . -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rootcoz.sidecarAgentSecretName" . }}
  labels:
    {{- include "rootcoz.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $data | nindent 2 }}
{{- end }}
