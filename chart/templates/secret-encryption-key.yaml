{{- include "rootcoz.validate" . -}}
{{- $key := include "rootcoz.encryptionKey" . -}}
{{- if $key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rootcoz.encryptionSecretName" . }}
  labels:
    {{- include "rootcoz.labels" . | nindent 4 }}
type: Opaque
data:
  ROOTCOZ_ENCRYPTION_KEY: {{ $key | b64enc | quote }}
{{- end }}
