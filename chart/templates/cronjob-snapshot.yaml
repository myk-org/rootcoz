{{- include "rootcoz.validate" . -}}
{{- if .Values.snapshots.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rootcoz.fullname" . }}-snapshot-script
  labels:
    {{- include "rootcoz.labels" . | nindent 4 }}
data:
  snapshot.sh: |
    #!/bin/sh
    set -eu
    NS="{{ .Release.Namespace }}"
    PVC="{{ include "rootcoz.pvcName" . }}"
    CLASS={{ .Values.snapshots.volumeSnapshotClass | quote }}
    RETENTION="{{ .Values.snapshots.retention }}"
    INSTANCE="{{ .Release.Name }}"
    TS="$(date -u +%Y%m%d-%H%M%S)"
    SNAP="rootcoz-data-${TS}"

    cat <<EOF | kubectl apply -f -
    apiVersion: snapshot.storage.k8s.io/v1
    kind: VolumeSnapshot
    metadata:
      name: ${SNAP}
      namespace: ${NS}
      labels:
        app.kubernetes.io/name: rootcoz
        app.kubernetes.io/instance: ${INSTANCE}
    spec:
      volumeSnapshotClassName: ${CLASS}
      source:
        persistentVolumeClaimName: ${PVC}
    EOF

    TOTAL="$(kubectl get volumesnapshot -n "${NS}" \
      -l "app.kubernetes.io/instance=${INSTANCE}" \
      --no-headers 2>/dev/null | wc -l | tr -d ' ')"
    DELETE=$((TOTAL - RETENTION))
    if [ "${DELETE}" -gt 0 ]; then
      kubectl get volumesnapshot -n "${NS}" \
        -l "app.kubernetes.io/instance=${INSTANCE}" \
        --sort-by=.metadata.creationTimestamp \
        -o name | head -n "${DELETE}" | \
        xargs -r -I{} kubectl delete {} -n "${NS}" --ignore-not-found
    fi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rootcoz.fullname" . }}-db-snapshot
  labels:
    {{- include "rootcoz.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.snapshots.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "rootcoz.selectorLabels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "rootcoz.fullname" . }}-snapshot
          restartPolicy: OnFailure
          containers:
            - name: snapshot
              image: bitnami/kubectl:1.32.3
              command: ["/bin/sh", "/scripts/snapshot.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: {{ include "rootcoz.fullname" . }}-snapshot-script
                defaultMode: 0555
{{- end }}
