# Tox/helm template fixture — sidecar agent dir custom provider (not for production).
ai:
  # Custom provider from the agent dir — exercises the schema's unrestricted
  # ai.provider (no built-in-alias enum) and the install-time credential rules.
  provider: mygateway
  model: mygateway/gpt-4o
admin:
  key: test-admin-key
encryptionKey: test-encryption-key-for-helm-template-render
sidecar:
  agentDir:
    modelsJson:
      providers:
        mygateway:
          baseUrl: https://mygateway.example.com/v1
          api: openai-completions
          apiKey: $MYGATEWAY_API_KEY
          models:
            - id: mygateway/gpt-4o
              name: GPT-4o via MyGateway
    env:
      MYGATEWAY_API_KEY: test-mygateway-key  # pragma: allowlist secret
