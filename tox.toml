skipsdist = true
envlist = ["backend", "frontend", "chart"]

[env.backend]
description = "Run Python tests"
commands = [
  [
    "uv",
    "run",
    "--extra",
    "tests",
    "pytest",
    "-n",
    "auto",
    "tests/",
    "-q",
  ],
]
allowlist_externals = ["uv"]

[env.frontend]
commands = [
  [
    "npm",
    "ci",
    "--no-audit",
    "--no-fund",
  ],
  [
    "npx",
    "vite",
    "build",
  ],
  [
    "npm",
    "test",
  ],
]
description = "Run frontend build and tests"
skip_install = true
allowlist_externals = ["npm", "npx"]
change_dir = "frontend"

[env.chart]
description = "Helm chart lint and template smoke tests"
skip_install = true
allowlist_externals = ["helm", "sh", "curl", "tar", "mkdir"]
passenv = ["PATH", "HOME"]
set_env.PATH = "{env:HOME}/.local/bin:{env:PATH}"
commands_pre = [
  ["sh", "-c", "command -v helm >/dev/null 2>&1 && exit 0; curl -fsSL https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz -o /tmp/helm.tar.gz && tar -xzf /tmp/helm.tar.gz -C /tmp && mkdir -p $HOME/.local/bin && mv /tmp/linux-amd64/helm $HOME/.local/bin/helm && rm -rf /tmp/linux-amd64 /tmp/helm.tar.gz"],
]
commands = [
  ["helm", "lint", "chart/"],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-openshift.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-kubernetes.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-clusterip.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set route.enabled=true --set ingress.enabled=true --set route.host=x.example.com --set ingress.host=y.example.com --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'mutually exclusive'",  # pragma: allowlist secret
  ],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-openshift.yaml",
    "-f",
    "chart/examples/values-vertex-fixture.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
  ],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-openshift.yaml",
    "-f",
    "chart/examples/values-cursor-fixture.yaml",
  ],

  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-openshift.yaml",
    "--set",
    "imageStream.enabled=true",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
]
