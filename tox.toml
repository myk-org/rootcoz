skipsdist = true
envlist = ["backend", "frontend", "chart"]

[env.backend]
description = "Run Python tests"
commands = [
  [
    "sh",
    "-c",
    # Cap the worker count at 8 rather than fixing it: `-n auto` trusts nproc, but CI
    # delivers far fewer effective cores than nproc reports while build-container runs
    # alongside the tests, so auto oversubscribes there; a fixed 8 oversubscribes small
    # runners. Take the smaller of the two.
    # Keep --durations=25: the posted CI log is truncated, so per-test cost has to sit
    # in its tail. Measured figures live in PR #432 and issue #431, not in this file.
    "N=$(nproc); [ \"$N\" -gt 8 ] && N=8; exec uv run --extra tests pytest -n \"$N\" tests/ -q --durations=25",
  ],
]
allowlist_externals = ["uv", "sh", "nproc"]

[env.frontend]
commands = [
  [
    "npm",
    "ci",
    "--no-audit",
    "--no-fund",
  ],
  [
    "npm",
    "run",
    "build",
  ],
  [
    "npm",
    "test",
  ],
]
description = "Run frontend type check, build and tests"
skip_install = true
allowlist_externals = ["npm", "npx"]
change_dir = "frontend"

[env.chart]
description = "Helm chart lint and template smoke tests"
skip_install = true
allowlist_externals = ["helm", "sh", "curl", "tar", "mkdir", "bash"]
passenv = ["PATH", "HOME"]
set_env.PATH = "{env:HOME}/.local/bin:{env:PATH}"
commands_pre = [
  ["sh", "-c", "helm version --short 2>/dev/null | grep -q '^v3[.]' && exit 0; OS=$(uname -s | tr '[:upper:]' '[:lower:]') && ARCH=$(uname -m) && case $ARCH in x86_64) ARCH=amd64;; aarch64|arm64) ARCH=arm64;; *) echo \"Unsupported architecture: $ARCH\"; exit 1;; esac && TMPD=/tmp/helm-install-$$ && mkdir -p $TMPD && trap 'rm -rf $TMPD' EXIT && HELM_TAR=helm-v3.17.3-${OS}-${ARCH}.tar.gz && cd $TMPD && curl -fsSL https://get.helm.sh/${HELM_TAR} -o ${HELM_TAR} && curl -fsSL https://get.helm.sh/${HELM_TAR}.sha256sum -o ${HELM_TAR}.sha256sum && sha256sum -c ${HELM_TAR}.sha256sum && tar -xzf ${HELM_TAR} && mkdir -p $HOME/.local/bin && mv ${OS}-${ARCH}/helm $HOME/.local/bin/helm"],
]
commands = [
  ["helm", "lint", "chart/"],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-openshift.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-kubernetes.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-clusterip.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "OUT=/tmp/rootcoz-production-$$.yaml && helm template rootcoz chart/ -f chart/examples/values-openshift.yaml -f chart/examples/values-production.yaml --set ai.geminiApiKey=test-key --set admin.key=test-admin-key --set encryptionKey=test-encryption-key-for-helm-template-render > $OUT && [ \"$(grep -c 'memory: 32Gi' $OUT)\" = 2 ] && [ \"$(grep -c 'cpu: \"4\"' $OUT)\" = 2 ] && [ \"$(grep -c 'ephemeral-storage: 16Gi' $OUT)\" = 2 ] && grep -q 'sizeLimit: \"16Gi\"' $OUT && ! grep -q '12Gi' $OUT && [ \"$(awk '/^      containers:/,/^      volumes:/' $OUT | grep -c 'mountPath: /tmp$')\" = 1 ] && [ \"$(awk '/^      initContainers:/,/^      containers:/' $OUT | grep -c 'mountPath: /tmp$')\" = 0 ] && rm -f $OUT",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "OUT=/tmp/rootcoz-production-sidecar-$$.yaml && helm template rootcoz chart/ -f chart/examples/values-openshift.yaml -f chart/examples/values-sidecar-agent-fixture.yaml -f chart/examples/values-production.yaml --set ai.geminiApiKey=test-key --set admin.key=test-admin-key --set encryptionKey=test-encryption-key-for-helm-template-render > $OUT && grep -q 'copy-sidecar-agent' $OUT && [ \"$(awk '/^      initContainers:/,/^      containers:/' $OUT | grep -c 'mountPath: /tmp$')\" = 0 ] && [ \"$(awk '/^      initContainers:/,/^      containers:/' $OUT | grep -c 'TMPDIR')\" = 0 ] && [ \"$(grep -c 'mountPath: /tmp$' $OUT)\" = 1 ] && [ \"$(grep -c 'name: TMPDIR' $OUT)\" = 1 ] && rm -f $OUT",  # pragma: allowlist secret
  ],
  # The default render (chart/ with only the required flags, no overlay) is the
  # baseline every install starts from: assert its resource block verbatim, the
  # /tmp emptyDir + sizeLimit + TMPDIR the defaults now carry (#402 C1), and the
  # XDG_CONFIG_HOME value read out of values.yaml so a change there cannot strand
  # the mount from the env var. It also asserts the shutdown budget (#458): the
  # grace period is 60, and it is larger than uvicorn's ceiling plus the app's
  # drain, read from their own files. Both, because 56-59 would satisfy the
  # relationship alone while no longer carrying the published 60, and because the
  # arithmetic must exist once.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ --set ai.provider=gemini --set ai.model=gemini-2.5-pro --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render' && OUT=/tmp/rootcoz-default-render-$$.yaml && $T > $OUT && EXP=$(printf '%s\\n' 'limits:' '  cpu: \"2\"' '  ephemeral-storage: 12Gi' '  memory: 8Gi' 'requests:' '  cpu: \"1\"' '  ephemeral-storage: 12Gi' '  memory: 4Gi') && GOT=$(awk '/^      containers:/,/^      volumes:/' $OUT | sed -n '/^          resources:/,/^          volumeMounts:/p' | sed -e '1d' -e '$d' -e 's/^            //') && if [ \"$GOT\" != \"$EXP\" ]; then printf 'default render resources changed:\\n%s\\n' \"$GOT\"; exit 1; fi && [ \"$(grep -c 'ephemeral-storage: 12Gi' $OUT)\" = 2 ] && grep -q 'sizeLimit: \"12Gi\"' $OUT && [ \"$(grep -c 'mountPath: /tmp$' $OUT)\" = 1 ] && [ \"$(grep -c 'name: TMPDIR' $OUT)\" = 1 ] && P=$(sed -n 's/^ *xdgConfigHome: *//p' chart/values.yaml) && [ -n \"$P\" ] && awk '/^      containers:/,/^      volumes:/' $OUT | grep -q \"value: \\\"$P\\\"\" && GRACE=$(awk '/terminationGracePeriodSeconds:/ {print $2; exit}' $OUT) && GRACEFUL=$(sed -n 's/.*--timeout-graceful-shutdown \\([0-9][0-9]*\\).*/\\1/p' entrypoint.sh | head -1) && DRAIN=$(sed -n 's/^SHUTDOWN_DRAIN_SECONDS = \\([0-9][0-9]*\\)$/\\1/p' src/rootcoz/main.py) && [ -n \"$GRACE\" ] && [ -n \"$GRACEFUL\" ] && [ -n \"$DRAIN\" ] && [ \"$GRACE\" = 60 ] && [ \"$GRACE\" -gt $((GRACEFUL + DRAIN)) ] && rm -f $OUT",  # pragma: allowlist secret
  ],
  # Arbitrary-UID XDG_CONFIG_HOME, asserted on the shipped entrypoint (the `--xdg-check`
  # argv gate stops it right after the bootstrap block). A path whose parent is a
  # regular file fails for every UID including root (ENOTDIR), so the fail-loud branch
  # is deterministic; a creatable path must be created and writable.
  [
    "sh",
    "-c",
    "D=/tmp/rootcoz-xdg-$$ && mkdir -p $D && touch $D/afile && ! XDG_CONFIG_HOME=$D/afile/config bash entrypoint.sh --xdg-check 2>$D/err && grep -qE \"XDG_CONFIG_HOME=$D/afile/config is not writable \\(uid=[0-9]+ gid=[0-9]+\\)\" $D/err && XDG_CONFIG_HOME=$D/cfg bash entrypoint.sh --xdg-check && [ -w $D/cfg ] && [ -z \"$(ls -A $D/cfg)\" ] && : > $D/cfg/probe && rm -rf $D",  # pragma: allowlist secret
  ],
  # The wait loop's exit status (#458), driven through the shipped script: the
  # `--wait-check` argv gate runs the real `_supervise_app` against a child that
  # ignores TERM until <release> exists, then exits <code>. A TERM arriving while
  # `wait` is interrupted must not become the exit code -- 0 for a clean stop (it
  # used to report the interruption's 143) -- while a real death must still
  # propagate as 7. The child touches <ready> itself, after ignoring TERM, so the
  # signal cannot land in the child's startup window.
  [
    "sh",
    "-c",
    '''
D=/tmp/rootcoz-wait-$$
mkdir -p $D
bash entrypoint.sh --wait-check $D/release-clean 0 $D/ready-clean &
P=$!
i=0
while [ ! -f $D/ready-clean ] && [ $i -lt 1000 ]; do i=$((i+1)); sleep 0.01; done
if [ ! -f $D/ready-clean ]; then echo "wait-check clean never entered the wait loop"; exit 1; fi
kill -TERM $P
: > $D/release-clean
wait $P
S=$?
if [ $S -ne 0 ]; then echo "wait-check clean expected 0, got $S"; exit 1; fi
bash entrypoint.sh --wait-check $D/release-crash 7 $D/ready-crash &
P=$!
i=0
while [ ! -f $D/ready-crash ] && [ $i -lt 1000 ]; do i=$((i+1)); sleep 0.01; done
if [ ! -f $D/ready-crash ]; then echo "wait-check crash never entered the wait loop"; exit 1; fi
kill -TERM $P
: > $D/release-crash
wait $P
S=$?
if [ $S -ne 7 ]; then echo "wait-check crash expected 7, got $S"; exit 1; fi
echo "wait-check clean=0 crash=7"
rm -rf $D
''',
  ],
  # The status Docker actually gets (#458). `--wait-check` above exercises supervision in
  # isolation, so it stayed green while every clean stop exited 143: the sidecar's EXIT
  # trap ran `wait` on the pid it had just TERMed, errexit aborted the trap there, and its
  # 143 replaced the status `_run_app` computed. This row drives the shipped script end to
  # end (`--exit-check`): a live sidecar behind that same EXIT trap, the signal traps and
  # the supervision. A clean stop -- TERM while the app is still shutting down -- must be
  # 0, and an app that dies on its own must still report its own 7, never the trap's 143.
  [
    "sh",
    "-c",
    '''
D=/tmp/rootcoz-exit-$$
mkdir -p $D
bash entrypoint.sh --exit-check $D/release-clean 0 $D/ready-clean &
P=$!
i=0
while [ ! -f $D/ready-clean ] && [ $i -lt 1000 ]; do i=$((i+1)); sleep 0.01; done
if [ ! -f $D/ready-clean ]; then echo "exit-check clean never started the app"; exit 1; fi
kill -TERM $P
: > $D/release-clean
wait $P
S=$?
if [ $S -ne 0 ]; then echo "exit-check clean expected 0, got $S"; exit 1; fi
bash entrypoint.sh --exit-check $D/release-crash 7 $D/ready-crash &
P=$!
i=0
while [ ! -f $D/ready-crash ] && [ $i -lt 1000 ]; do i=$((i+1)); sleep 0.01; done
if [ ! -f $D/ready-crash ]; then echo "exit-check crash never started the app"; exit 1; fi
: > $D/release-crash
wait $P
S=$?
if [ $S -ne 7 ]; then echo "exit-check crash expected 7, got $S"; exit 1; fi
echo "exit-check clean=0 crash=7"
rm -rf $D
''',
  ],
  # Probes are values, not template literals: 14 timing fields across three probes
  # (startup has no initialDelaySeconds — absent renders nothing and the API defaults
  # it to 0). Defaults are asserted for the two numbers that matter operationally
  # (readiness 5 s, liveness 30 s x 5), then every field is proved wired by rendering
  # a distinct number per probe per field and comparing each block verbatim — so a
  # literal sneaking back into the template fails, and so does one probe rendering
  # another probe's constant. Readiness successThreshold is proved the same way (25):
  # it may be > 1. Startup/liveness successThreshold stay 1 — Kubernetes rejects
  # anything else there, so a literal 1 and the value render identically.
  # Targets stay literal by design (#402 B4): readiness/liveness GET /health, the
  # startup probe is the exec /api/health sidecar wait.
  # Never put a colon inside a shell brace group in this env: tox's own `{...}` replacer
  # reads it as a `{key:value}` delimiter and truncates the command (4.67.4; fine on
  # 4.67.13). This holds for every brace group here, not just the three below.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ --set ai.provider=gemini --set ai.model=gemini-2.5-pro --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render' && OUT=/tmp/rootcoz-probes-$$.yaml && $T > $OUT && [ \"$(awk '/^          readinessProbe:/,/^          livenessProbe:/' $OUT | grep -c 'timeoutSeconds: 5$')\" = 1 ] && [ \"$(awk '/^          livenessProbe:/,/^          resources:/' $OUT | grep -cE 'timeoutSeconds: 30$|failureThreshold: 5$')\" = 2 ] && [ \"$(awk '/^          readinessProbe:/,/^          livenessProbe:/' $OUT | grep -c 'path: /health$')\" = 1 ] && [ \"$(awk '/^          livenessProbe:/,/^          resources:/' $OUT | grep -c 'path: /health$')\" = 1 ] && [ \"$(awk '/^          readinessProbe:/,/^          resources:/' $OUT | grep -c 'api/health')\" = 0 ] && [ \"$(awk '/^          startupProbe:/,/^          readinessProbe:/' $OUT | grep -c 'curl -sf http://localhost:8000/api/health')\" = 1 ] && $T --set probes.startup.periodSeconds=12 --set probes.startup.timeoutSeconds=13 --set probes.startup.failureThreshold=14 --set probes.readiness.initialDelaySeconds=21 --set probes.readiness.periodSeconds=22 --set probes.readiness.timeoutSeconds=23 --set probes.readiness.failureThreshold=24 --set probes.readiness.successThreshold=25 --set probes.liveness.initialDelaySeconds=31 --set probes.liveness.periodSeconds=32 --set probes.liveness.timeoutSeconds=33 --set probes.liveness.failureThreshold=34 > $OUT && EXP=$(printf '%s\\n' 'periodSeconds: 12' 'timeoutSeconds: 13' 'failureThreshold: 14' 'successThreshold: 1') && GOT=$(awk '/^          startupProbe:/,/^          readinessProbe:/' $OUT | grep -E '^            (initialDelaySeconds|periodSeconds|timeoutSeconds|failureThreshold|successThreshold):' | sed 's/^ *//') && { [ \"$GOT\" = \"$EXP\" ] || { printf 'startup probe does not follow probes.startup\\n%s\\n' \"$GOT\"; exit 1; }; } && EXP=$(printf '%s\\n' 'initialDelaySeconds: 21' 'periodSeconds: 22' 'timeoutSeconds: 23' 'failureThreshold: 24' 'successThreshold: 25') && GOT=$(awk '/^          readinessProbe:/,/^          livenessProbe:/' $OUT | grep -E '^            (initialDelaySeconds|periodSeconds|timeoutSeconds|failureThreshold|successThreshold):' | sed 's/^ *//') && { [ \"$GOT\" = \"$EXP\" ] || { printf 'readiness probe does not follow probes.readiness\\n%s\\n' \"$GOT\"; exit 1; }; } && EXP=$(printf '%s\\n' 'initialDelaySeconds: 31' 'periodSeconds: 32' 'timeoutSeconds: 33' 'failureThreshold: 34' 'successThreshold: 1') && GOT=$(awk '/^          livenessProbe:/,/^          resources:/' $OUT | grep -E '^            (initialDelaySeconds|periodSeconds|timeoutSeconds|failureThreshold|successThreshold):' | sed 's/^ *//') && { [ \"$GOT\" = \"$EXP\" ] || { printf 'liveness probe does not follow probes.liveness\\n%s\\n' \"$GOT\"; exit 1; }; } && rm -f $OUT",  # pragma: allowlist secret
  ],
  # The probes group rejects what the template cannot: a wrong type (5s), a typo'd key
  # (readines), a successThreshold Kubernetes refuses (liveness) and a readiness
  # successThreshold below 1. Without it all of them render silently and the API
  # server refuses the pod mid-upgrade.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ --set ai.provider=gemini --set ai.model=gemini-2.5-pro --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render' && L=/tmp/rootcoz-bad-probes-$$.log && ! $T --set probes.readiness.timeoutSeconds=5s > $L 2>&1 && grep -q 'probes.readiness.timeoutSeconds: Invalid type. Expected: integer, given: string' $L && ! $T --set probes.readines.periodSeconds=3 > $L 2>&1 && grep -q 'probes: Additional property readines is not allowed' $L && ! $T --set probes.liveness.successThreshold=2 > $L 2>&1 && grep -q 'must be one of the following: 1' $L && ! $T --set probes.readiness.successThreshold=0 > $L 2>&1 && grep -q 'probes.readiness.successThreshold: Must be greater than or equal to 1' $L && rm -f $L",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set resources.limit.cpu=4 --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'resources: Additional property limit is not allowed'",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set resources.requests.cpuu=4 --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'resources.requests: Additional property cpuu is not allowed'",  # pragma: allowlist secret
  ],
  # memory/ephemeral-storage take any Kubernetes quantity: a bare number (bytes for
  # memory/storage), a leading decimal point and exponent form all validate.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render' && OUT=/tmp/rootcoz-quantity-forms-$$.yaml && $T --set resources.limits.cpu=2 --set resources.limits.memory=4 --set resources.requests.ephemeral-storage=16 > $OUT && grep -q 'cpu: 2$' $OUT && grep -q 'memory: 4$' $OUT && grep -q 'ephemeral-storage: 16$' $OUT && $T --set resources.requests.memory=.5Gi --set resources.limits.cpu=1e3 > $OUT && grep -q 'memory: .5Gi' $OUT && grep -q 'cpu: \"1e3\"' $OUT && rm -f $OUT",  # pragma: allowlist secret
  ],
  # A bad unit must still fail at schema validation, not reach the API server.
  [
    "sh",
    "-c",
    "helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set resources.limits.memory=4GiB --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'resources.limits.memory: Does not match pattern'",  # pragma: allowlist secret
  ],
  # cpu is a quantity too: a typo must fail at schema validation, not at the API server after install.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render'; L=/tmp/rootcoz-bad-cpu-limits-$$.log; R=/tmp/rootcoz-bad-cpu-requests-$$.log && ! $T --set resources.limits.cpu=not-a-quantity > $L 2>&1 && grep -q 'resources.limits.cpu: Does not match pattern' $L && ! $T --set resources.requests.cpu=not-a-quantity > $R 2>&1 && grep -q 'resources.requests.cpu: Does not match pattern' $R && rm -f $L $R",  # pragma: allowlist secret
  ],
  # Valid cpu quantities still pass: milli form and an explicit string quantity.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render'; OUT=/tmp/rootcoz-good-cpu-$$.yaml && $T --set resources.limits.cpu=4m > $OUT && grep -q 'cpu: 4m' $OUT && $T --set-string resources.limits.cpu=4 > $OUT && grep -q 'cpu: \"4\"' $OUT && rm -f $OUT",  # pragma: allowlist secret
  ],
  # "" means omit: the empty key must be dropped, not rendered as an invalid quantity.
  [
    "sh",
    "-c",
    "OUT=/tmp/rootcoz-empty-resource-$$.yaml && helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set 'resources.requests.memory=' --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render > $OUT && [ \"$(grep -c 'memory:' $OUT)\" = 1 ] && grep -q 'memory: 8Gi' $OUT && grep -q 'cpu: \"1\"' $OUT && ! grep -q 'memory: \"\"' $OUT && rm -f $OUT",  # pragma: allowlist secret
  ],
  # QoS is computed across init containers: a gap there makes a Guaranteed app Burstable.
  [
    "sh",
    "-c",
    "OUT=/tmp/rootcoz-init-qos-$$.yaml && helm template rootcoz chart/ -f chart/examples/values-openshift.yaml -f chart/examples/values-sidecar-agent-fixture.yaml > $OUT && awk '/^      initContainers:/,/^      containers:/' $OUT > $OUT.init && [ \"$(grep -cE '^              (cpu|memory):' $OUT.init)\" = 4 ] && REQ=$(sed -n '/^            requests:/,/^            limits:/p' $OUT.init | grep -E '^              (cpu|memory):' | sed 's/^ *//') && LIM=$(sed -n '/^            limits:/,/^          command:/p' $OUT.init | grep -E '^              (cpu|memory):' | sed 's/^ *//') && [ -n \"$REQ\" ] && [ \"$REQ\" = \"$LIM\" ] && rm -f $OUT $OUT.init",  # pragma: allowlist secret
  ],
  # A key is a native resource or a valid extended-resource name. The part after "/" is a
  # Kubernetes qualified name, so mixed case, "_" and "." are legal there (nvidia.com/GPU_2
  # would render on the API server); the domain must stay a lowercase DNS subdomain and both
  # ends alphanumeric, so a malformed name still fails before install.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render'; OUT=/tmp/rootcoz-extended-names-$$.yaml && $T --set 'resources.requests.nvidia\\.com/gpu=1' --set 'resources.limits.hugepages-2Mi=1Gi' --set-json 'resources.limits={\"example.com/GPU_2\":1,\"example.com/foo.bar_baz\":2}' > $OUT && grep -q 'nvidia.com/gpu: 1' $OUT && grep -q 'hugepages-2Mi: 1Gi' $OUT && grep -q 'example.com/GPU_2: 1' $OUT && grep -q 'example.com/foo.bar_baz: 2' $OUT && ! $T --set-json 'resources.limits={\"Example.COM/x\":1}' > $OUT 2>&1 && grep -q 'Additional property Example.COM/x is not allowed' $OUT && ! $T --set-json 'resources.limits={\"example.com/-bad\":1}' > $OUT 2>&1 && grep -q 'Additional property example.com/-bad is not allowed' $OUT && rm -f $OUT",  # pragma: allowlist secret
  ],
  # Wrong types, not just wrong keys or strings: a loosened schema would let these render a pod
  # the API server refuses. Covers a list where a quantity goes (native and extended key) and a
  # number in the string→string maps. The wrong-type list is `[1]`, not `[]`: tox strips a
  # literal empty bracket pair out of the command string.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render'; L=/tmp/rootcoz-bad-types-$$.log && ! $T --set-json 'resources.limits.memory=[1]' > $L 2>&1 && grep -q 'resources.limits.memory: Must validate at least one schema' $L && ! $T --set-json 'resources.limits={\"nvidia.com/gpu\":[1]}' > $L 2>&1 && grep -q 'resources.limits.nvidia.com/gpu: Invalid type' $L && ! $T --set-json 'podAnnotations={\"team\":1}' > $L 2>&1 && grep -q 'podAnnotations.team: Invalid type. Expected: string, given: integer' $L && ! $T --set-json 'podLabels={\"team\":1}' > $L 2>&1 && grep -q 'podLabels.team: Invalid type. Expected: string, given: integer' $L && ! $T --set-json 'nodeSelector={\"gpu\":true}' > $L 2>&1 && grep -q 'nodeSelector.gpu: Invalid type. Expected: string, given: boolean' $L && rm -f $L",  # pragma: allowlist secret
  ],
  [
