skipsdist = true
envlist = ["backend", "frontend", "chart"]

[env.backend]
description = "Run Python tests"
commands = [
  [
    "sh",
    "-c",
    # Cap the worker count at 8 rather than fixing it: `-n auto` trusts nproc, but CI
    # delivers far fewer effective cores than nproc reports while build-container runs
    # alongside the tests, so auto oversubscribes there; a fixed 8 oversubscribes small
    # runners. Take the smaller of the two.
    # Keep --durations=25: the posted CI log is truncated, so per-test cost has to sit
    # in its tail. Measured figures live in PR #432 and issue #431, not in this file.
    "N=$(nproc); [ \"$N\" -gt 8 ] && N=8; exec uv run --extra tests pytest -n \"$N\" tests/ -q --durations=25",
  ],
]
allowlist_externals = ["uv", "sh", "nproc"]

[env.frontend]
commands = [
  [
    "npm",
    "ci",
    "--no-audit",
    "--no-fund",
  ],
  [
    "npm",
    "run",
    "build",
  ],
  [
    "npm",
    "test",
  ],
]
description = "Run frontend type check, build and tests"
skip_install = true
allowlist_externals = ["npm", "npx"]
change_dir = "frontend"

[env.chart]
description = "Helm chart lint and template smoke tests"
skip_install = true
allowlist_externals = ["helm", "sh", "curl", "tar", "mkdir"]
passenv = ["PATH", "HOME"]
set_env.PATH = "{env:HOME}/.local/bin:{env:PATH}"
commands_pre = [
  ["sh", "-c", "helm version --short 2>/dev/null | grep -q '^v3[.]' && exit 0; OS=$(uname -s | tr '[:upper:]' '[:lower:]') && ARCH=$(uname -m) && case $ARCH in x86_64) ARCH=amd64;; aarch64|arm64) ARCH=arm64;; *) echo \"Unsupported architecture: $ARCH\"; exit 1;; esac && TMPD=/tmp/helm-install-$$ && mkdir -p $TMPD && trap 'rm -rf $TMPD' EXIT && HELM_TAR=helm-v3.17.3-${OS}-${ARCH}.tar.gz && cd $TMPD && curl -fsSL https://get.helm.sh/${HELM_TAR} -o ${HELM_TAR} && curl -fsSL https://get.helm.sh/${HELM_TAR}.sha256sum -o ${HELM_TAR}.sha256sum && sha256sum -c ${HELM_TAR}.sha256sum && tar -xzf ${HELM_TAR} && mkdir -p $HOME/.local/bin && mv ${OS}-${ARCH}/helm $HOME/.local/bin/helm"],
]
commands = [
  ["helm", "lint", "chart/"],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-openshift.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-kubernetes.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-clusterip.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "OUT=/tmp/rootcoz-production-$$.yaml && helm template rootcoz chart/ -f chart/examples/values-openshift.yaml -f chart/examples/values-production.yaml --set ai.geminiApiKey=test-key --set admin.key=test-admin-key --set encryptionKey=test-encryption-key-for-helm-template-render > $OUT && [ \"$(grep -c 'memory: 32Gi' $OUT)\" = 2 ] && [ \"$(grep -c 'cpu: \"4\"' $OUT)\" = 2 ] && [ \"$(grep -c 'ephemeral-storage: 16Gi' $OUT)\" = 2 ] && grep -q 'sizeLimit: \"16Gi\"' $OUT && [ \"$(awk '/^      containers:/,/^      volumes:/' $OUT | grep -c 'mountPath: /tmp$')\" = 1 ] && [ \"$(awk '/^      initContainers:/,/^      containers:/' $OUT | grep -c 'mountPath: /tmp$')\" = 0 ] && rm -f $OUT",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "OUT=/tmp/rootcoz-production-sidecar-$$.yaml && helm template rootcoz chart/ -f chart/examples/values-openshift.yaml -f chart/examples/values-sidecar-agent-fixture.yaml -f chart/examples/values-production.yaml --set ai.geminiApiKey=test-key --set admin.key=test-admin-key --set encryptionKey=test-encryption-key-for-helm-template-render > $OUT && grep -q 'copy-sidecar-agent' $OUT && [ \"$(awk '/^      initContainers:/,/^      containers:/' $OUT | grep -c 'mountPath: /tmp$')\" = 0 ] && [ \"$(awk '/^      initContainers:/,/^      containers:/' $OUT | grep -c 'TMPDIR')\" = 0 ] && [ \"$(grep -c 'mountPath: /tmp$' $OUT)\" = 1 ] && [ \"$(grep -c 'name: TMPDIR' $OUT)\" = 1 ] && rm -f $OUT",  # pragma: allowlist secret
  ],
  # The default render (chart/ with only the required flags, no overlay) is the
  # baseline every install starts from: assert its resource block verbatim and
  # that no ephemeral-storage (hence no /tmp emptyDir, sizeLimit or TMPDIR) is added.
  # Never put a colon inside the shell brace group below: tox's own `{...}` replacer
  # reads it as a `{key:value}` delimiter and truncates the command (4.67.4; fine on 4.67.13).
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ --set ai.provider=gemini --set ai.model=gemini-2.5-pro --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render' && OUT=/tmp/rootcoz-default-render-$$.yaml && $T > $OUT && EXP=$(printf '%s\\n' 'limits:' '  cpu: \"2\"' '  memory: 8Gi' 'requests:' '  cpu: \"1\"' '  memory: 4Gi') && GOT=$(sed -n '/^      containers:/,/^      volumes:/p' $OUT | sed -n '/^          resources:/,/^          volumeMounts:/p' | sed -e '1d' -e '$d' -e 's/^            //') && { [ \"$GOT\" = \"$EXP\" ] || { printf 'default render resources changed\\n%s\\n' \"$GOT\"; exit 1; }; } && ! grep -q 'ephemeral-storage' $OUT && ! grep -q 'sizeLimit' $OUT && ! grep -q 'mountPath: /tmp$' $OUT && ! grep -q 'name: TMPDIR' $OUT && rm -f $OUT",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set resources.limit.cpu=4 --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'resources: Additional property limit is not allowed'",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set resources.requests.cpuu=4 --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'resources.requests: Additional property cpuu is not allowed'",  # pragma: allowlist secret
  ],
  # memory/ephemeral-storage take any Kubernetes quantity: a bare number (bytes for
  # memory/storage), a leading decimal point and exponent form all validate.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render' && OUT=/tmp/rootcoz-quantity-forms-$$.yaml && $T --set resources.limits.cpu=2 --set resources.limits.memory=4 --set resources.requests.ephemeral-storage=16 > $OUT && grep -q 'cpu: 2$' $OUT && grep -q 'memory: 4$' $OUT && grep -q 'ephemeral-storage: 16$' $OUT && $T --set resources.requests.memory=.5Gi --set resources.limits.cpu=1e3 > $OUT && grep -q 'memory: .5Gi' $OUT && grep -q 'cpu: \"1e3\"' $OUT && rm -f $OUT",  # pragma: allowlist secret
  ],
  # A bad unit must still fail at schema validation, not reach the API server.
  [
    "sh",
    "-c",
    "helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set resources.limits.memory=4GiB --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'resources.limits.memory: Does not match pattern'",  # pragma: allowlist secret
  ],
  # cpu is a quantity too: a typo must fail at schema validation, not at the API server after install.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render'; L=/tmp/rootcoz-bad-cpu-limits-$$.log; R=/tmp/rootcoz-bad-cpu-requests-$$.log && ! $T --set resources.limits.cpu=not-a-quantity > $L 2>&1 && grep -q 'resources.limits.cpu: Does not match pattern' $L && ! $T --set resources.requests.cpu=not-a-quantity > $R 2>&1 && grep -q 'resources.requests.cpu: Does not match pattern' $R && rm -f $L $R",  # pragma: allowlist secret
  ],
  # Valid cpu quantities still pass: milli form and an explicit string quantity.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render'; OUT=/tmp/rootcoz-good-cpu-$$.yaml && $T --set resources.limits.cpu=4m > $OUT && grep -q 'cpu: 4m' $OUT && $T --set-string resources.limits.cpu=4 > $OUT && grep -q 'cpu: \"4\"' $OUT && rm -f $OUT",  # pragma: allowlist secret
  ],
  # "" means omit: the empty key must be dropped, not rendered as an invalid quantity.
  [
    "sh",
    "-c",
    "OUT=/tmp/rootcoz-empty-resource-$$.yaml && helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set 'resources.requests.memory=' --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render > $OUT && [ \"$(grep -c 'memory:' $OUT)\" = 1 ] && grep -q 'memory: 8Gi' $OUT && grep -q 'cpu: \"1\"' $OUT && ! grep -q 'memory: \"\"' $OUT && rm -f $OUT",  # pragma: allowlist secret
  ],
  # QoS is computed across init containers: a gap there makes a Guaranteed app Burstable.
  [
    "sh",
    "-c",
    "OUT=/tmp/rootcoz-init-qos-$$.yaml && helm template rootcoz chart/ -f chart/examples/values-openshift.yaml -f chart/examples/values-sidecar-agent-fixture.yaml > $OUT && awk '/^      initContainers:/,/^      containers:/' $OUT > $OUT.init && [ \"$(grep -cE '^              (cpu|memory):' $OUT.init)\" = 4 ] && REQ=$(sed -n '/^            requests:/,/^            limits:/p' $OUT.init | grep -E '^              (cpu|memory):' | sed 's/^ *//') && LIM=$(sed -n '/^            limits:/,/^          command:/p' $OUT.init | grep -E '^              (cpu|memory):' | sed 's/^ *//') && [ -n \"$REQ\" ] && [ \"$REQ\" = \"$LIM\" ] && rm -f $OUT $OUT.init",  # pragma: allowlist secret
  ],
  # A key is a native resource or a valid extended-resource name. The part after "/" is a
  # Kubernetes qualified name, so mixed case, "_" and "." are legal there (nvidia.com/GPU_2
  # would render on the API server); the domain must stay a lowercase DNS subdomain and both
  # ends alphanumeric, so a malformed name still fails before install.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render'; OUT=/tmp/rootcoz-extended-names-$$.yaml && $T --set 'resources.requests.nvidia\\.com/gpu=1' --set 'resources.limits.hugepages-2Mi=1Gi' --set-json 'resources.limits={\"example.com/GPU_2\":1,\"example.com/foo.bar_baz\":2}' > $OUT && grep -q 'nvidia.com/gpu: 1' $OUT && grep -q 'hugepages-2Mi: 1Gi' $OUT && grep -q 'example.com/GPU_2: 1' $OUT && grep -q 'example.com/foo.bar_baz: 2' $OUT && ! $T --set-json 'resources.limits={\"Example.COM/x\":1}' > $OUT 2>&1 && grep -q 'Additional property Example.COM/x is not allowed' $OUT && ! $T --set-json 'resources.limits={\"example.com/-bad\":1}' > $OUT 2>&1 && grep -q 'Additional property example.com/-bad is not allowed' $OUT && rm -f $OUT",  # pragma: allowlist secret
  ],
  # Wrong types, not just wrong keys or strings: a loosened schema would let these render a pod
  # the API server refuses. Covers a list where a quantity goes (native and extended key) and a
  # number in the string→string maps. The wrong-type list is `[1]`, not `[]`: tox strips a
  # literal empty bracket pair out of the command string.
  [
    "sh",
    "-c",
    "T='helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render'; L=/tmp/rootcoz-bad-types-$$.log && ! $T --set-json 'resources.limits.memory=[1]' > $L 2>&1 && grep -q 'resources.limits.memory: Must validate at least one schema' $L && ! $T --set-json 'resources.limits={\"nvidia.com/gpu\":[1]}' > $L 2>&1 && grep -q 'resources.limits.nvidia.com/gpu: Invalid type' $L && ! $T --set-json 'podAnnotations={\"team\":1}' > $L 2>&1 && grep -q 'podAnnotations.team: Invalid type. Expected: string, given: integer' $L && ! $T --set-json 'podLabels={\"team\":1}' > $L 2>&1 && grep -q 'podLabels.team: Invalid type. Expected: string, given: integer' $L && ! $T --set-json 'nodeSelector={\"gpu\":true}' > $L 2>&1 && grep -q 'nodeSelector.gpu: Invalid type. Expected: string, given: boolean' $L && rm -f $L",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set resources.requests.cpu=4 --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render | grep -q 'cpu: 4'",  # pragma: allowlist secret
  ],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-openshift.yaml",
    "-f",
    "chart/examples/values-vertex-fixture.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
  ],
  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-openshift.yaml",
    "-f",
    "chart/examples/values-cursor-fixture.yaml",
  ],

  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-openshift.yaml",
    "-f",
    "chart/examples/values-sidecar-agent-fixture.yaml",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "OUT=/tmp/rootcoz-sidecar-agent-test-$$.yaml; helm template rootcoz chart/ -f chart/examples/values-openshift.yaml -f chart/examples/values-sidecar-agent-fixture.yaml --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render > $OUT 2>&1 && grep -q 'PI_SIDECAR_AGENT_DIR' $OUT && grep -q 'copy-sidecar-agent' $OUT && grep -q '/etc/pi-sidecar-agent-src' $OUT && grep -A1 'name: sidecar-agent$' $OUT | grep -q 'emptyDir: {}' && ! grep -A1 'mountPath: /etc/pi-sidecar-agent$' $OUT | grep -q 'readOnly: true' && grep -q 'MYGATEWAY_API_KEY' $OUT && grep -q 'AI_PROVIDER: \"mygateway\"' $OUT && rm -f $OUT && ! helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'PI_SIDECAR_AGENT_DIR'",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set sidecar.agentDir.env.BAD-KEY=x --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'sidecar.agentDir.env: Property name of \"BAD-KEY\" does not match'",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set sidecar.agentDir.env.ADMIN_KEY=x --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'collides with a chart-managed environment variable' && helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set sidecar.agentDir.env.CURSOR_API_KEY=x --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'collides with a chart-managed environment variable' && helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set sidecar.agentDir.env.AI_PROVIDER=x --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'collides with a chart-managed environment variable' && helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set sidecar.agentDir.env.SIDECAR_PORT=x --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'collides with a chart-managed environment variable'",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.provider=GEMINI --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'ai.geminiApiKey is required when ai.provider is gemini'",  # pragma: allowlist secret
  ],

  [
    "helm",
    "template",
    "rootcoz",
    "chart/",
    "-f",
    "chart/examples/values-openshift.yaml",
    "--set",
    "imageStream.enabled=true",
    "--set",
    "ai.geminiApiKey=test-key",  # pragma: allowlist secret
    "--set",
    "admin.key=test-admin-key",  # pragma: allowlist secret
    "--set",
    "encryptionKey=test-encryption-key-for-helm-template-render",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "OUT=/tmp/rootcoz-alerts-test-$$.yaml; helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render --set alerts.enabled=true --set alerts.diskWarnPercent=80 --set alerts.schedule='*/2 * * * *' --set 'imagePullSecrets[0].name=regcred' > $OUT 2>&1 && [ \"$(grep -c 'kind: CronJob' $OUT)\" = \"1\" ] && grep -qF 'schedule: \"*/2 * * * *\"' $OUT && grep -A1 'name: DISK_WARN_PERCENT' $OUT | grep -q '\"80\"' && grep -q 'secretKeyRef' $OUT && grep -q 'health-alert.sh' $OUT && sed -n '/kind: CronJob/,$p' $OUT | grep -q 'automountServiceAccountToken: false' && sed -n '/kind: CronJob/,$p' $OUT | grep -A1 'imagePullSecrets:' | grep -q 'name: regcred' && sed -n '/kind: CronJob/,$p' $OUT | grep -A8 'resources:' | grep -q 'cpu: 10m' && sed -n '/kind: CronJob/,$p' $OUT | grep -A8 'resources:' | grep -q 'memory: 16Mi' && rm -f $OUT",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    # A 60-char name must still produce a CronJob <= 52 (the Job controller appends 11)
    # and a ConfigMap <= 63, with the script volume pointing at that ConfigMap.
    "OUT=/tmp/rootcoz-alerts-long-name-$$.yaml; LONG=$(awk 'BEGIN{for(i=0;i<60;i++) printf \"a\"}'); helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render --set alerts.enabled=true --set fullnameOverride=$LONG > $OUT 2>&1 && CJ=$(grep -oE '^  name: .*-health-alerts$' $OUT | awk '{print $2}') && CM=$(grep -oE '^  name: .*-health-alerts-script$' $OUT | awk '{print $2}') && [ -n \"$CJ\" ] && [ ${#CJ} -le 52 ] && [ -n \"$CM\" ] && [ ${#CM} -le 63 ] && grep -A1 'configMap:' $OUT | grep -qF \"name: $CM\" && rm -f $OUT",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    # Two releases whose fullnames share the first 38 chars must not collide: the
    # derived names carry a hash of the whole fullname, still within 52 / 63.
    "P=$(awk 'BEGIN{for(i=0;i<38;i++) printf \"a\"}'); A=/tmp/rootcoz-alerts-shared-prefix-a-$$.yaml; B=/tmp/rootcoz-alerts-shared-prefix-b-$$.yaml; T='helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render --set alerts.enabled=true'; $T --set fullnameOverride=$P-one > $A 2>&1 && $T --set fullnameOverride=$P-two > $B 2>&1 && CJA=$(grep -oE '^  name: .*-health-alerts$' $A | awk '{print $2}') && CJB=$(grep -oE '^  name: .*-health-alerts$' $B | awk '{print $2}') && CMA=$(grep -oE '^  name: .*-health-alerts-script$' $A | awk '{print $2}') && CMB=$(grep -oE '^  name: .*-health-alerts-script$' $B | awk '{print $2}') && [ -n \"$CJA\" ] && [ -n \"$CJB\" ] && [ \"$CJA\" != \"$CJB\" ] && [ -n \"$CMA\" ] && [ -n \"$CMB\" ] && [ \"$CMA\" != \"$CMB\" ] && [ ${#CJA} -le 52 ] && [ ${#CJB} -le 52 ] && [ ${#CMA} -le 63 ] && [ ${#CMB} -le 63 ] && rm -f $A $B",  # pragma: allowlist secret
  ],
  [
    "sh",
    "-c",
    "! helm template rootcoz chart/ -f chart/examples/values-openshift.yaml --set ai.geminiApiKey=k --set admin.key=a --set encryptionKey=test-encryption-key-for-helm-template-render 2>&1 | grep -q 'kind: CronJob'",  # pragma: allowlist secret
  ],
]
