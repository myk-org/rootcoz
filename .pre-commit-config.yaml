---
default_language_version:
  python: python3.14

ci:
  autofix_prs: false
  autoupdate_commit_msg: "ci: [pre-commit.ci] pre-commit autoupdate"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md] # Do not process Markdown files.
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: check-builtin-literals
      - id: check-toml

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        args: [--config=.flake8]
        additional_dependencies:
          [git+https://github.com/RedHatQE/flake8-plugins.git, flake8-mutable]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^docs/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix, --target-version=py314]
      - id: ruff-format
        args: [--target-version=py314]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        language_version: python3.14
        exclude: (tests/)
        additional_dependencies:
          [types-requests, types-PyYAML, types-colorama, types-aiofiles, pydantic, pi-sidecar-client]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.12.0
    hooks:
      - id: eslint
        files: \.js$
        exclude: (eslint\.config\.js|^docs/|^frontend/)
        args: [--fix]
        additional_dependencies:
          - eslint@9.38.0

  # The mirrors-eslint hook above installs a bare eslint in its own venv, so it
  # cannot resolve the typescript-eslint / react-hooks / react-refresh plugins
  # that frontend/eslint.config.js loads from frontend/node_modules — and it
  # excludes ^frontend/ outright, leaving every .ts/.tsx file unlinted. This hook
  # runs the project's own eslint against the project's own config instead.
  #
  # pre-commit passes only the changed files, so this blocks new lint problems
  # without forcing a cleanup of the existing ones. It is a no-op when the
  # frontend dependencies are not installed (fresh clone, CI without a build
  # step), so it never blocks a commit on a missing toolchain.
  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (frontend ts/tsx)
        entry: frontend/scripts/eslint-changed.sh
        language: script
        files: ^frontend/src/.*\.(ts|tsx)$
        require_serial: true
