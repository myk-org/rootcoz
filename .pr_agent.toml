[config]
add_repo_metadata = true
ignore_pr_title = ["^chore: bump version"]

# docs/ build output (HTML, assets/, llms*.txt, search-index.json) is no longer
# committed — .github/workflows/docs.yml builds it on main from docs/*.md and
# docs-guard.yml rejects it in a PR. These globs stay as a safety net so a
# slipped-in artefact never lands in review scope; the .md sources stay reviewable.
[ignore]
glob = [
  "docs/*.html",
  "docs/assets/*",
  "docs/llms.txt",
  "docs/llms-full.txt",
  "docs/search-index.json",
]

[github_app]
handle_push_trigger = true
pr_commands = ["/agentic_review", "/agentic_describe"]
push_commands = ["/agentic_review"]

[review_agent]
comments_location_policy = "both"
inline_comments_severity_threshold = 1
