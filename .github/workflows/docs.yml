name: Docs

on:
  push:
    branches: [main]
    paths:
      # Any docs change, not just .md: the migration that removes the committed output touches
      # only generated paths, and it must still deploy.
      - "docs/**"
  # The first deploy after Pages is switched to build_type=workflow has no push to ride on.
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # workflow_dispatch accepts any ref, so without this guard `gh workflow run docs.yml --ref
    # some-branch` would publish that branch's docs/ to the live Pages site. Deploying is main-only;
    # a manual run is still how the first deploy after the Pages switch is triggered.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build site from docs/*.md
        run: >-
          uvx pi-docsite --docs-dir docs
          --tagline "AI-powered CI failure analysis for Jenkins, Prow, and JUnit XML"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
