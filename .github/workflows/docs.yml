name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**.md"
      - "docs/nav.json"

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build site from docs/*.md
        run: >-
          uvx pi-docsite --docs-dir docs
          --tagline "AI-powered CI failure analysis for Jenkins, Prow, and JUnit XML"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
